name: vibes_nest
description: "Vibes Nest — a mental wellness companion app."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.6.1


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  animated_bottom_navigation_bar: ^1.4.0
  page_transition: ^2.2.1
  url_launcher: ^6.1.14
  youtube_player_flutter: ^9.1.1
  intl: 0.20.3
  shared_preferences: ^2.5.2
  fl_chart: ^0.70.2

  material_ui: 1.11.0
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_ai: ^5.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  fake_cloud_firestore: ^4.5.0
  firebase_auth_mocks: ^0.16.0
flutter:
  uses-material-design: true

  assets:
    - assets/images/

