name: vibes_nest
description: "Vibes Nest — a mental wellness companion app."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.6.1


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  animated_bottom_navigation_bar: ^1.4.0
  page_transition: ^2.2.1
  url_launcher: ^6.1.14
  youtube_player_flutter: ^9.1.1
  intl: 0.20.3
  shared_preferences: ^2.5.2
  fl_chart: ^0.70.2

  material_ui: 1.11.0
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_ai: ^5.2.0
  firebase_app_check: ^0.5.2
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  fake_cloud_firestore: ^4.5.0
  firebase_auth_mocks: ^0.16.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  image: ^4.13.1
flutter:
  uses-material-design: true

  assets:
    - assets/images/


# App icon: regenerate artwork with `dart run tool/generate_icon.dart`,
# then apply with `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#3a8b5f"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21

# Splash screen: apply with `dart run flutter_native_splash:create`.
flutter_native_splash:
  color: "#296e48"
  image: "assets/icon/splash.png"
  android_12:
    color: "#296e48"
    image: "assets/icon/splash.png"
  ios: false
  web: false
